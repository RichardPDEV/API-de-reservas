server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      max-lifetime: ${DB_MAX_LIFETIME:1800000}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: simple
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:resend}
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
          ssl:
            enable: ${MAIL_SMTP_SSL:false}
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT:30000}
          timeout: ${MAIL_SMTP_TIMEOUT:30000}
          writetimeout: ${MAIL_SMTP_WRITETIMEOUT:30000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  health:
    db:
      enabled: true
    mail:
      enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO

app:
  mail:
    from: ${MAIL_FROM}
  auth:
    debug-confirmation-code: false

# Producción: sin defaults inseguros para CORS/cookies/JWT/mail.
# ProdStartupValidator exige DB_*, APP_JWT_SECRET, APP_CORS_ALLOWED_ORIGINS,
# APP_COOKIE_SECURE=true, APP_COOKIE_SAMESITE, MAIL_HOST, MAIL_PASSWORD y MAIL_FROM.
