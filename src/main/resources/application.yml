server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: simple

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  health:
    db:
      enabled: true
    mail:
      enabled: false

logging:
  level:
    org.springframework: INFO

app:
  mail:
    from: ${MAIL_FROM:}
  auth:
    debug-confirmation-code: ${APP_AUTH_DEBUG_CONFIRMATION_CODE:false}
