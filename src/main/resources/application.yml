server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/reservas}
    username: ${DB_USERNAME:reservas}
    password: ${DB_PASSWORD:reservas}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: simple

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
  health:
    db:
      enabled: true
    mail:
      enabled: false

logging:
  level:
    org.springframework: INFO

app:
  mail:
    from: ${MAIL_FROM:reservas@example.com}
  auth:
    debug-confirmation-code: ${APP_AUTH_DEBUG_CONFIRMATION_CODE:false}

# Desarrollo local: cookies con defaults seguros para HTTP local.
# CORS y cookies en prod se exigen vía variables de entorno (ProdStartupValidator).
APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:false}
APP_COOKIE_SAMESITE: ${APP_COOKIE_SAMESITE:Lax}
